name: Store Candidate Polish

on:
  push:
    branches:
      - feat/v1.2.0-store-candidate
    paths:
      - scripts/store-candidate-polish.py
      - scripts/store-candidate-i18n-privacy.py
      - .github/workflows/store-candidate-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1.2.0-store-candidate

      - name: Apply Store Candidate polish
        run: |
          python3 scripts/store-candidate-polish.py
          python3 scripts/store-candidate-i18n-privacy.py

      - name: Validate PHP and JavaScript
        run: |
          php -l resenas-wordpress.php
          node --check assets/front.js

      - name: Commit generated polish
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resenas-wordpress.php
          git commit -m "Apply Store Candidate i18n and privacy hardening"
          git push origin HEAD:feat/v1.2.0-store-candidate
