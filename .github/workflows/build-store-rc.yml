name: Build Store RC

on:
  push:
    branches:
      - feat/v1.2.0-store-candidate
    paths:
      - resenas-wordpress.php
      - assets/**
      - languages/**
      - readme.txt
      - LICENSE
      - scripts/build-store-package.sh
      - .github/workflows/build-store-rc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Store Candidate
        uses: actions/checkout@v4

      - name: Prepare clean package
        run: bash scripts/build-store-package.sh

      - name: Validate package sources
        run: |
          php -l build/gestion-resenas/gestion-resenas.php
          node --check build/gestion-resenas/assets/front.js
          test -f build/gestion-resenas/languages/gestion-resenas-es_ES.mo
          test -f build/gestion-resenas/languages/gestion-resenas-es_ES.po
          test -f build/gestion-resenas/languages/gestion-resenas.pot

      - name: Create RC ZIP and checksum
        working-directory: build
        run: |
          zip -r gestion-resenas-1.2.0-rc4.zip gestion-resenas
          sha256sum gestion-resenas-1.2.0-rc4.zip > gestion-resenas-1.2.0-rc4.zip.sha256
          unzip -t gestion-resenas-1.2.0-rc4.zip

      - name: Upload RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-resenas-1.2.0-rc4
          path: |
            build/gestion-resenas-1.2.0-rc4.zip
            build/gestion-resenas-1.2.0-rc4.zip.sha256
          if-no-files-found: error
